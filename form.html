<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loginform</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(105, 106, 105);
        }
        .container{
            margin:50px;
            display: grid;
            justify-content: center;
            align-items: center;
        }
        .loginform, 
        .Registerform{
            width: 400px;
            margin: 50px;
            text-align: center;
            background-color: white;
            display: grid;
            justify-content: center;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 5px greenyellow;
        }
        .logo img{
            height: 80px;
        }
        .head h3{
            margin:10px ;
            font-size: 1.5rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .head p{
            font-weight: 600;
        }
        .input input{
            width: 300px;
            height: 35px;
            margin: 10px;
            padding: 0px 20px;
            border: none;
            border-bottom: 2px solid gray;
            border-radius: 10px;
            box-shadow: 0px 0px 4px;
        }
        .input a{
            text-decoration: none;
            color: gray;
            font-size: 16px;
            cursor: pointer;
        }
        .input button{
            margin: 0 0 20px 0;
            padding: 8px 120px;
            border: none;
            border-radius: 20px;
            background-color: rgb(195, 228, 248);
            font-weight: 600;
            cursor: pointer;
        }
        .input button:hover{
            background-color: rgb(78, 137, 173);
            color: white;
        }
        .input p{
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- LOGIN FORM -->
    <div class="loginform">
        <div class="logo">
            <img src="pics/img1.png" alt="">
        </div>

        <div class="head">
            <h3>Information Technology</h3>
            <p><span style="color: red;">Login form</span></p>
        </div>

        <div class="input">
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <p><a href="#">Forgot Username / Password?</a></p>
            <button type="button">Login</button>

            <p>Don't have an account?
                <a href="#" id="showRegister" style="color: blue;">Register</a>
            </p>
        </div>
    </div>

    <!-- REGISTER FORM -->
    <div class="Registerform" style="display:none;">
        <div class="logo">
            <img src="pics/img1.png" alt="">
        </div>

        <div class="head">
            <h3>Information Technology</h3>
            <p><span style="color: red;">Registration form</span></p>
        </div>

        <div class="input">
            <input type="text" name="FirstName" placeholder="First Name">
            <input type="text" name="SecondName" placeholder="Second Name">
            <input type="email" name="Email" placeholder="Email">
            <input type="tel" name="Phone" placeholder="Phone">
            <input type="password" name="Password" placeholder="Password">
            <input type="password" name="ConfirmPassword" placeholder="Confirm Password">

            <button type="button">Register</button>

            <p>Already have an account?
                <a href="#" id="showLogin" style="color: blue;">Login</a>
            </p>
        </div>
    </div>

</div>

<script>
    const loginForm = document.querySelector('.loginform');
    const registerForm = document.querySelector('.Registerform');

    document.getElementById('showRegister').onclick = function(e){
        e.preventDefault();
        loginForm.style.display = 'none';
        registerForm.style.display = 'grid';
    };

    document.getElementById('showLogin').onclick = function(e){
        e.preventDefault();
        registerForm.style.display = 'none';
        loginForm.style.display = 'grid';
    };
</script>

</body>
</html>
